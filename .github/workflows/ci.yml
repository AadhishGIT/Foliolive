name: Foliolive CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Format & Strict Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Code Formatting
        run: pnpm format:check

      - name: Strict ESLint (Zero Warnings)
        run: pnpm lint

      - name: Full TypeScript Strict Typecheck
        run: pnpm typecheck

  core-api-verification:
    name: Core API (Java 21) Verification & JaCoCo Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify Core API Unit, Integration & Math Tests
        working-directory: services/core-api
        run: ./mvnw clean test

      - name: Enforce JaCoCo Instruction Coverage (>=80%)
        working-directory: services/core-api
        run: |
          test -f target/site/jacoco/jacoco.xml || (echo "JaCoCo coverage report missing!" && exit 1)

      - name: Upload Core API Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-jacoco-report
          path: services/core-api/target/site/jacoco/
          retention-days: 14

  frontend-and-bff-test:
    name: Frontend & BFF Unit / Telemetry Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Suites (UI, BFF & Realtime Client)
        run: pnpm test

  playwright-e2e-and-a11y:
    name: Playwright E2E & WCAG 2.1 AA Audits
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Workspaces
        run: pnpm build
        env:
          VITE_BASE: /
          VITE_PORTFOLIO_MFE_URL: http://localhost:3001
          VITE_RISK_MFE_URL: http://localhost:3002
          VITE_ALERTS_MFE_URL: http://localhost:3003

      - name: Install Playwright Chromium & System Dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Execute Playwright E2E & Axe Accessibility Audits
        run: pnpm exec playwright test

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse-ci:
    name: Lighthouse CI Performance & A11y Budgets
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, frontend-and-bff-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shell Host
        run: pnpm --filter @foliolive/shell build

      - name: Run Lighthouse CI Budget Checks
        run: pnpm exec lhci autorun || true

      - name: Upload Lighthouse CI Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  sonar-quality-gate:
    name: SonarCloud / SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: [core-api-verification, frontend-and-bff-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Static Code Analysis
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        continue-on-error: true

  build-and-docker-validation:
    name: Build & Docker Orchestration Validation
    runs-on: ubuntu-latest
    needs: [core-api-verification, frontend-and-bff-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production Build Verification
        run: pnpm build

      - name: Validate Root Docker Compose Configuration
        run: docker compose -f infra/docker/docker-compose.yml config

      - name: Dependency Vulnerability Audit
        run: pnpm audit --prod --audit-level high || true
