name: Foliolive CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint TypeScript & React
        run: pnpm lint

      - name: Strict Typecheck
        run: pnpm typecheck

  core-api-test:
    name: Core API (Java 21) Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Core API Unit & Risk Math Tests
        working-directory: services/core-api
        run: ./mvnw test -Dtest="*ServiceTest"

      - name: Verify JaCoCo Coverage Report
        working-directory: services/core-api
        run: |
          test -f target/site/jacoco/jacoco.xml || exit 1

  frontend-and-bff-test:
    name: Frontend & BFF Unit / Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Suites (UI & BFF)
        run: pnpm test

  e2e-and-a11y-audits:
    name: Playwright E2E & WCAG 2.2 AA Audits
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Workspaces
        run: pnpm build

      - name: Install Playwright Chromium & OS Dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Execute Playwright E2E & Axe Accessibility Tests
        run: pnpm exec playwright test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build-and-docker-validation:
    name: Build & Docker Orchestration Validation
    runs-on: ubuntu-latest
    needs: [core-api-test, frontend-and-bff-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and BFF
        run: pnpm build

      - name: Validate Root Docker Compose Configuration
        run: docker compose config

      - name: Dependency Vulnerability Audit
        run: pnpm audit --prod --audit-level high || true
