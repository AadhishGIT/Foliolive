global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'foliolive-core-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['core-api:8080']

  - job_name: 'foliolive-bff'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bff:4000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
