server:
  port: ${CORE_API_PORT:8080}

spring:
  application:
    name: foliolive-core-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foliolive}
    username: ${POSTGRES_USER:foliolive_user}
    password: ${POSTGRES_PASSWORD:foliolive_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

security:
  jwt:
    secret: ${JWT_SECRET:foliolive-development-hmac-sha256-secret-must-be-at-least-32-bytes!}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
