spring:
  application:
    name: foliolive-core-api-test
  datasource:
    url: jdbc:h2:mem:foliolivetest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

security:
  jwt:
    secret: foliolive-development-hmac-sha256-secret-must-be-at-least-32-bytes!
    expiration-seconds: 86400
