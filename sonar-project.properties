# SonarQube / SonarCloud Configuration for Foliolive Monorepo
sonar.projectKey=foliolive-platform
sonar.projectName=Foliolive Institutional Portfolio & Risk Analytics Platform
sonar.projectVersion=0.1.0

# Source & Test Inclusions
sonar.sources=apps,packages,services/bff/src,services/core-api/src/main/java
sonar.tests=e2e,services/bff/test,packages/ui/test,packages/realtime-client/test,services/core-api/src/test/java

# Inclusions & Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.turbo/**,**/target/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/storybook-static/**,**/build/**
sonar.coverage.exclusions=**/test/**,**/*.test.*,**/*.spec.*,**/scripts/**,**/data/**,**/*.stories.tsx,**/infra/**,**/docs/**

# Code Coverage Reports
sonar.javascript.lcov.reportPaths=packages/ui/coverage/lcov.info,services/bff/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=services/core-api/target/site/jacoco/jacoco.xml

# Java Bytecode Binaries
sonar.java.binaries=services/core-api/target/classes
sonar.java.source=21

# Encoding
sonar.sourceEncoding=UTF-8
