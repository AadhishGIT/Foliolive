# SonarQube & SonarCloud Monorepo Configuration
sonar.projectKey=foliolive
sonar.organization=foliolive
sonar.projectName=Foliolive Real-Time Portfolio & Risk Analytics Platform
sonar.projectVersion=0.1.0

# Source & Test paths
sonar.sources=apps,packages,services
sonar.tests=e2e,packages/ui/test,services/bff/test,services/core-api/src/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*Test.java

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/.system_generated/**,**/docs/**,**/scratch/**
sonar.coverage.exclusions=**/*.config.ts,**/main.tsx,**/vite-env.d.ts,**/generated/**

# TypeScript & JavaScript Analysis
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.base.json,apps/*/tsconfig.json,packages/*/tsconfig.json,services/*/tsconfig.json

# Test & Coverage Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info,packages/ui/coverage/lcov.info,services/bff/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=services/core-api/target/site/jacoco/jacoco.xml
sonar.java.binaries=services/core-api/target/classes

# Quality Gate Thresholds
sonar.qualitygate.wait=true
